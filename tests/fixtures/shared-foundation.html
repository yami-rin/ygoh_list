<!doctype html>
<html lang="ja" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shared foundation fixture</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/page-shell.css">
  <script type="module">
    import { applyTheme, getTheme } from '/js/shared/theme.js';
    applyTheme(getTheme(), { persist: false });
    window.__foundationReady = true;
  </script>
</head>
<body>
  <nav class="navbar ygo-nav" data-ygo-component="app-nav">
    <div class="container">
      <a class="navbar-brand ygo-brand" href="#">Card Manager</a>
      <a class="nav-link" href="#" aria-current="page">Fixture</a>
    </div>
  </nav>
  <main class="ygo-page" data-page="fixture">
    <header class="ygo-page-header">
      <div>
        <p class="ygo-eyebrow">FOUNDATION</p>
        <h1>共通基盤fixture</h1>
      </div>
      <div class="ygo-page-actions">
        <button class="btn ygo-btn ygo-btn--primary" type="button">Primary</button>
        <button class="btn ygo-btn ygo-btn--ghost" type="button">Ghost</button>
      </div>
    </header>
    <div class="ygo-stack">
      <section class="ygo-surface ygo-card" data-ygo-component="surface">
        <div class="ygo-card__header"><strong>Surface</strong></div>
        <div class="ygo-card__body">
          <form class="ygo-filter-bar" role="search">
            <input class="form-control ygo-field" type="search" aria-label="検索">
            <button class="btn ygo-btn ygo-btn--primary" type="submit">検索</button>
          </form>
        </div>
      </section>
      <div class="table-responsive ygo-table-wrap" data-ygo-component="table">
        <table class="table ygo-table">
          <thead><tr><th class="sortable" aria-sort="ascending">名前</th></tr></thead>
          <tbody><tr><td>青眼の白龍</td></tr></tbody>
        </table>
      </div>
      <div id="fixture-loading" class="ygo-loading" role="status" aria-live="polite" hidden>読み込み中…</div>
      <div id="fixture-empty" class="ygo-empty" hidden>
        <p class="ygo-empty__title">データがありません</p>
        <p class="ygo-empty__description"></p>
      </div>
    </div>
  </main>
  <div id="fixture-modal" class="modal" aria-hidden="true" hidden>
    <div class="modal-dialog"><div class="modal-content ygo-modal"><div class="modal-body">Modal</div></div></div>
  </div>
  <div id="fixture-toasts" class="ygo-toast-region toast-container" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
